<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OAuth Probe</title>
    <style>
      html, body {
        width: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
        background: #fafafa;
        color: #0f172a;
        font-size: 13px;
        line-height: 1.45;
        padding: 12px;
      }
      * { box-sizing: border-box; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      h2 { font-size: 12px; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; color: #64748b; }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid rgba(15, 23, 42, 0.12);
        background: #fff;
        color: inherit;
        border-radius: 8px;
        padding: 7px 10px;
      }
      button:hover { background: #f1f5f9; }
      button.primary { background: #7c3aed; color: #fff; border-color: #7c3aed; }
      button.primary:hover { background: #6d28d9; }
      button.on { background: #0f172a; color: #fff; border-color: #0f172a; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      input {
        font: inherit;
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: 8px;
        padding: 6px 8px;
        min-width: 0;
      }
      .card {
        background: #fff;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
      }
      .muted { color: #64748b; }
      .log {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        white-space: pre-wrap;
        max-height: 260px;
        overflow-y: auto;
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 8px;
      }
      .verdict { font-weight: 600; padding: 8px; border-radius: 8px; margin-bottom: 8px; }
      .verdict.ok { background: #dcfce7; color: #166534; }
      .verdict.bad { background: #fee2e2; color: #991b1b; }
      .verdict.idle { background: #f1f5f9; color: #475569; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>window.__PROBE_SURFACE = "side-panel";</script>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
